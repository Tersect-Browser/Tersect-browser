<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Vite prefixes these root paths with the app's base path
         (vite.config.ts), so they also resolve on deep links such as
         /datasets/drafts/<id>. -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Installable web app: a manifest and icons, no service worker. The app
         needs its server for everything, so there is nothing useful to cache
         offline, and no cached copy can go stale after a release.
         use-credentials: deployments sit behind a password (basic auth), and
         browsers fetch the manifest without credentials otherwise. -->
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
    <meta name="theme-color" content="#1f7a47" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tersect" />
    <title>Tersect Browser</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
